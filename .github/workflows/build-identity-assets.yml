name: Build original brand assets in batches

on:
  push:
    paths:
      - ".github/workflows/build-identity-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dr-fayza-identity-package
  cancel-in-progress: false

jobs:
  build-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Check source files and typography
        run: |
          set -euo pipefail
          test -f "brand/source/original/هوية كاملة.ai"
          test -f "brand/source/original/هوية كاملة-02.png"
          test -f AGCBold.ttf
          test -f AGCRegular.ttf
          test -f MyriadPro-Regular.otf
          test -f tt0003m.ttf
          python -m py_compile tools/build_identity_assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Batch 1 - Primary alternate monochrome and horizontal logos
        run: |
          set -euo pipefail
          python tools/build_identity_assets.py logos
          git add brand/logos/
          git commit -m "assets: add primary alternate monochrome and secondary logo variants"
          git push origin HEAD:main

      - name: Batch 2 - Transparent symbols
        run: |
          set -euo pipefail
          python tools/build_identity_assets.py symbols
          git add brand/symbols/
          git commit -m "assets: extract transparent original logo symbols"
          git push origin HEAD:main

      - name: Batch 3 - Icons and favicon
        run: |
          set -euo pipefail
          python tools/build_identity_assets.py icons
          git add brand/icons/
          git commit -m "assets: add clinic app icons and favicon sizes"
          git push origin HEAD:main

      - name: Batch 4 - Geometry patterns
        run: |
          set -euo pipefail
          python tools/build_identity_assets.py patterns
          git add brand/patterns/
          git commit -m "assets: add motif patterns derived from original identity board"
          git push origin HEAD:main

      - name: Batch 5 - Colors typography docs and generated inventory
        run: |
          set -euo pipefail
          python tools/build_identity_assets.py docs
          git add brand/colors brand/typography brand/docs
          git commit -m "docs: finalize source color tokens fonts and identity asset inventory"
          git push origin HEAD:main

      - name: Validate complete identity pack
        run: |
          set -euo pipefail
          test -s brand/logos/primary/logo-primary-vertical-color.png
          test -s brand/logos/secondary/logo-horizontal-primary.png
          test -s brand/symbols/symbol-primary-color.png
          test -s brand/icons/favicon-48.png
          test -s brand/patterns/geometric-motif-outline.png
          test -s brand/colors/tokens.css
          test -s brand/typography/fonts-used.md
          echo "Identity assets completed and committed in 5 batches"
