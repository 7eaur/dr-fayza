name: Clinic Design Visual QA
on:
  push:
    branches:
      - design/agency-suite-fayza-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Playwright
        working-directory: website
        run: |
          npm install --no-save --ignore-scripts --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect public branch preview
        working-directory: website
        env:
          CLINIC_PREVIEW_URL: https://dr-fayza-git-design-agency-suite-fayza-20261109-wasl15.vercel.app
        run: node scripts/visual-audit.mjs
      - name: Upload visual report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dr-fayza-agency-visual-audit
          path: website/visual-audit/
          if-no-files-found: warn
          retention-days: 14
